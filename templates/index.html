
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>House Price Prediction</h1>
    <p>Enter House Details to Predict Its Price</p>

    <form action="/predict" method="POST">

        <label>Area</label>
        <input type="number" name="Area" min="1" step="any" required>

        <label>Bedrooms</label>
        <input type="number" name="Bedrooms" min="1" required>

        <label>Bathrooms</label>
        <input type="number" name="Bathrooms" min="1" required>

        <label>Floors</label>
        <input type="number" name="Floors" min="1" required>

        <label>Year Built</label>
        <input type="number" name="YearBuilt" min="1800" max="2026" required>

        <label>Location</label>
        <select name="Location" required>
            <option value="">Select Location</option>
            <option value="Downtown">Downtown</option>
            <option value="Urban">Urban</option>
            <option value="Suburban">Suburban</option>
            <option value="Rural">Rural</option>
        </select>

        <label>Condition</label>
        <select name="Condition" required>
            <option value="">Select Condition</option>
            <option value="Poor">Poor</option>
            <option value="Fair">Fair</option>
            <option value="Good">Good</option>
            <option value="Excellent">Excellent</option>
        </select>

        <label>Garage</label>
        <select name="Garage" required>
            <option value="">Select Garage</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <button type="submit">Predict House Price</button>

    </form>

    {% if prediction is not none %}
    <div class="result">
        Predicted House Price: ₹{{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
